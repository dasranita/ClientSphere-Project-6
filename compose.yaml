services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clientsphere
      POSTGRES_USER: clientsphere
      POSTGRES_PASSWORD: local_dev_only
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clientsphere"]
      interval: 5s
      retries: 15
  redis:
    image: redis:7-alpine
  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://clientsphere:local_dev_only@db:5432/clientsphere
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGIN: http://localhost:3000
    ports: ["4000:4000"]
    depends_on:
      db: {condition: service_healthy}
  intelligence:
    build: ./intelligence
    ports: ["8000:8000"]
  web:
    build:
      context: ./web
      args: {NEXT_PUBLIC_API_URL: "http://localhost:4000"}
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  pgdata:
